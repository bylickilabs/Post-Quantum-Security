name: Installation / Environment Report
description: Dokumentiere Installations-, Start- und Abhängigkeitsprobleme unter Windows.
title: "[Install] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        # 🧩 Installation / Environment Report

        Verwende dieses Formular für Probleme bei Installation, Einrichtung, Abhängigkeiten oder dem Start von Post Quantum Security.

        **Alle Angaben sind verpflichtend.** Falls eine Information nicht bekannt ist, trage `Nicht bekannt` ein.

  - type: dropdown
    id: affected_stage
    attributes:
      label: Betroffener Bereich
      options:
        - install-windows.ps1
        - requirements.txt / pip install
        - liboqs / liboqs-python
        - Visual Studio Build Tools
        - CMake
        - Git
        - Start über main.py
        - Start über run_windows.bat
        - PySide6 / GUI-Start
        - Sonstige Umgebung
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: Anwendungsversion
      placeholder: z. B. 1.1.0 oder Commit-SHA
    validations:
      required: true

  - type: input
    id: windows_version
    attributes:
      label: Windows-Version
      placeholder: z. B. Windows 11 Pro 24H2, Build ...
    validations:
      required: true

  - type: input
    id: architecture
    attributes:
      label: Systemarchitektur
      placeholder: z. B. x64
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python-Version
      placeholder: z. B. Python 3.13.x
    validations:
      required: true

  - type: textarea
    id: dependency_versions
    attributes:
      label: Abhängigkeiten / Toolchain
      placeholder: |
        PySide6 = ...
        cryptography = ...
        argon2-cffi = ...
        liboqs-python = ...
        liboqs / OQS = ...
        Git = ...
        CMake = ...
        Visual Studio Build Tools = ...
    validations:
      required: true

  - type: dropdown
    id: ml_kem_available
    attributes:
      label: ML-KEM-768 verfügbar
      options:
        - Ja
        - Nein
        - Nicht geprüft
        - Nicht bekannt
    validations:
      required: true

  - type: dropdown
    id: ml_dsa_available
    attributes:
      label: ML-DSA-65 verfügbar
      options:
        - Ja
        - Nein
        - Nicht geprüft
        - Nicht bekannt
    validations:
      required: true

  - type: textarea
    id: installation_steps
    attributes:
      label: Durchgeführte Installations- oder Startschritte
      placeholder: |
        1. ...
        2. ...
        3. ...
        4. Fehler tritt auf
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Erwartetes Verhalten
      placeholder: Erwartet wurde ...
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Tatsächliches Verhalten
      placeholder: Tatsächlich passiert ...
    validations:
      required: true

  - type: textarea
    id: error_output
    attributes:
      label: Konsolenausgabe / Fehlermeldung
      description: Entferne persönliche Pfade oder vertrauliche Daten, falls erforderlich.
      render: shell
      placeholder: Vollständige relevante Ausgabe
    validations:
      required: true

  - type: textarea
    id: attempted_fixes
    attributes:
      label: Bereits getestete Lösungsversuche
      placeholder: Welche Schritte wurden bereits durchgeführt?
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Bestätigung
      options:
        - label: Ich habe die verwendeten Versionen und die Startmethode vollständig angegeben.
          required: true
        - label: Die Fehlermeldung wurde ohne Passwörter, Schlüssel oder sonstige Geheimnisse veröffentlicht.
          required: true
        - label: Alle Pflichtfelder wurden vollständig ausgefüllt.
          required: true
