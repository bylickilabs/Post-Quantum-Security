name: Signature / Verification Report
description: Report reproducible issues with ML-DSA-65 file signing or signature verification.
title: "[Signature] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        # ✍️ Signature / Verification Report

        Use this form for reproducible problems involving ML-DSA-65 signatures, `.qsig` files, signing, or verification.

        **Never publish private signing keys, passwords, or confidential source files.**

  - type: dropdown
    id: operation
    attributes:
      label: Affected operation
      options:
        - Sign file
        - Verify signature
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: Application version
      placeholder: e.g. 1.1.0 or commit SHA
    validations:
      required: true

  - type: input
    id: input_file
    attributes:
      label: Input file type / approximate size
      description: Do not upload confidential content.
      placeholder: e.g. PDF, ZIP, PNG, 15 MB
    validations:
      required: true

  - type: dropdown
    id: signature_file
    attributes:
      label: "`.qsig` file involved"
      options:
        - Yes, generated by this application
        - Yes, loaded from disk
        - No
        - Unknown
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: Performed workflow
      placeholder: |
        1. Selected source file
        2. Selected ML-DSA key
        3. Signed / verified
        4. Result / error ...
    validations:
      required: true

  - type: textarea
    id: expected_result
    attributes:
      label: Expected result
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual_result
    attributes:
      label: Actual result
      placeholder: What happened instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        Windows = ...
        Python = ...
        liboqs-python = ...
        ML-DSA-65 availability = ...
    validations:
      required: true

  - type: textarea
    id: error_output
    attributes:
      label: Error message / traceback
      description: Remove all sensitive information before submitting.
      render: shell
      placeholder: Error output or None available
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional observations / evidence
      placeholder: Reproducibility, screenshots, non-sensitive logs, or None available
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I reproduced or directly observed the reported signing / verification behavior.
          required: true
        - label: I did not include passwords, private keys, or confidential source files.
          required: true
        - label: This is not a security-critical vulnerability requiring confidential disclosure.
          required: true
        - label: All required fields have been completed.
          required: true
