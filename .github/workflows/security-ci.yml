name: PQS Security & Crypto CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: pqs-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Security & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff bandit pip-audit

      - name: Compile Python sources
        run: python -m compileall -q app crypto gui main.py

      - name: Critical Python static checks
        run: ruff check app crypto gui main.py --select E9,F63,F7,F82

      - name: Python security scan
        run: bandit -r app crypto gui main.py -ll -ii

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

  crypto-self-test:
    name: Cryptographic Self-Test
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run PQS cryptographic self-test
        run: python .github/scripts/crypto_self_test.py

  windows-validation:
    name: Windows Application Validation
    runs-on: windows-latest
    needs: security-audit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app crypto gui main.py

      - name: Validate application imports
        shell: pwsh
        run: |
          python -c "import app.constants; import app.database; import app.i18n; import crypto.core; import crypto.container; import crypto.keys; import crypto.pq; import crypto.signatures; import gui.main_window; print('Windows import validation passed.')"

  codeql:
    name: CodeQL Python Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
