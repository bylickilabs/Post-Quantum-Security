name: PQS Windows EXE Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/windows-exe-release.yml
      - .github/scripts/generate_windows_icon.py
      - .github/scripts/generate_windows_version_info.py
      - .github/scripts/pyinstaller_oqs_runtime.py
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v1.0.0. Leave empty for latest release."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: pqs-windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-exe:
    name: Build and Publish Windows EXE
    runs-on: windows-latest

    steps:
      - name: Resolve target release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
          } elseif ($env:INPUT_TAG) {
            $tag = $env:INPUT_TAG.Trim()
          } else {
            $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
              "User-Agent" = "pqs-windows-exe-release"
            }
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/releases/latest" -Headers $headers -Method Get
            $tag = [string]$release.tag_name
          }

          if (-not $tag) {
            throw "No release tag could be resolved."
          }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Unsupported release tag format: $tag"
          }

          $version = $tag.Substring(1)
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Target release: $tag"

      - name: Wait for GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "pqs-windows-exe-release"
          }
          $encodedTag = [uri]::EscapeDataString($env:RELEASE_TAG)
          $uri = "https://api.github.com/repos/$env:GH_REPO/releases/tags/$encodedTag"
          $deadline = (Get-Date).AddMinutes(10)

          do {
            try {
              $release = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get
              if ($release.tag_name -eq $env:RELEASE_TAG) {
                Write-Host "Release $env:RELEASE_TAG is available."
                exit 0
              }
            } catch {
              Start-Sleep -Seconds 5
              continue
            }
            Start-Sleep -Seconds 5
          } while ((Get-Date) -lt $deadline)

          throw "Release $env:RELEASE_TAG was not available within the expected time window."

      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: source
          fetch-depth: 0

      - name: Checkout main for build infrastructure and README
        uses: actions/checkout@v7
        with:
          ref: main
          path: repository
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: source/requirements.txt

      - name: Install application and build dependencies
        shell: pwsh
        working-directory: source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pillow

      - name: Build minimal liboqs runtime
        id: liboqs
        shell: pwsh
        working-directory: source
        run: |
          $oqsVersion = python -c "import importlib.metadata; print(importlib.metadata.version('liboqs-python'))"
          $oqsVersion = $oqsVersion.Trim()
          if (-not $oqsVersion) {
            throw "Could not determine liboqs-python version."
          }

          $buildRoot = Join-Path $env:GITHUB_WORKSPACE "oqs-build"
          $sourceDir = Join-Path $buildRoot "liboqs"
          $installDir = Join-Path $buildRoot "install"

          New-Item -ItemType Directory -Force -Path $buildRoot | Out-Null
          git clone --depth 1 --branch $oqsVersion https://github.com/open-quantum-safe/liboqs.git $sourceDir

          cmake -S $sourceDir -B "$sourceDir\build" `
            -DCMAKE_INSTALL_PREFIX="$installDir" `
            -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=TRUE `
            -DBUILD_SHARED_LIBS=ON `
            -DOQS_BUILD_ONLY_LIB=ON `
            -DOQS_USE_OPENSSL=OFF `
            '-DOQS_MINIMAL_BUILD=KEM_ml_kem_768;SIG_ml_dsa_65'

          cmake --build "$sourceDir\build" --config Release --parallel 4
          cmake --install "$sourceDir\build" --config Release

          $oqsDll = Join-Path $installDir "bin\oqs.dll"
          if (-not (Test-Path $oqsDll)) {
            throw "Compiled oqs.dll was not found at $oqsDll"
          }

          "install=$installDir" >> $env:GITHUB_OUTPUT
          "dll=$oqsDll" >> $env:GITHUB_OUTPUT
          "OQS_INSTALL_PATH=$installDir" >> $env:GITHUB_ENV
          "$installDir\bin" >> $env:GITHUB_PATH

      - name: Validate embedded post-quantum runtime
        shell: pwsh
        working-directory: source
        run: |
          python -c "import oqs; assert 'ML-KEM-768' in oqs.get_enabled_kem_mechanisms(); assert 'ML-DSA-65' in oqs.get_enabled_sig_mechanisms(); print('liboqs runtime validation passed.')"

      - name: Prepare Windows icon and version metadata
        id: metadata
        shell: pwsh
        run: |
          $sourceIconScript = Join-Path $env:GITHUB_WORKSPACE "source\.github\scripts\generate_windows_icon.py"
          $mainIconScript = Join-Path $env:GITHUB_WORKSPACE "repository\.github\scripts\generate_windows_icon.py"
          $sourceVersionScript = Join-Path $env:GITHUB_WORKSPACE "source\.github\scripts\generate_windows_version_info.py"
          $mainVersionScript = Join-Path $env:GITHUB_WORKSPACE "repository\.github\scripts\generate_windows_version_info.py"
          $sourceRuntimeHook = Join-Path $env:GITHUB_WORKSPACE "source\.github\scripts\pyinstaller_oqs_runtime.py"
          $mainRuntimeHook = Join-Path $env:GITHUB_WORKSPACE "repository\.github\scripts\pyinstaller_oqs_runtime.py"

          if (Test-Path $sourceIconScript) { $iconScript = $sourceIconScript } else { $iconScript = $mainIconScript }
          if (Test-Path $sourceVersionScript) { $versionScript = $sourceVersionScript } else { $versionScript = $mainVersionScript }
          if (Test-Path $sourceRuntimeHook) { $runtimeHook = $sourceRuntimeHook } else { $runtimeHook = $mainRuntimeHook }

          foreach ($required in @($iconScript, $versionScript, $runtimeHook)) {
            if (-not (Test-Path $required)) {
              throw "Required EXE build resource not found: $required"
            }
          }

          $resourceDir = Join-Path $env:GITHUB_WORKSPACE "windows-build-resources"
          New-Item -ItemType Directory -Force -Path $resourceDir | Out-Null

          $icon = Join-Path $resourceDir "PostQuantumSecurity.ico"
          $versionFile = Join-Path $resourceDir "windows-version-info.txt"

          python "$iconScript" --output "$icon"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $icon)) {
            throw "Windows icon generation failed."
          }

          python "$versionScript" --version "${{ steps.release.outputs.version }}" --output "$versionFile"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $versionFile)) {
            throw "Windows version resource generation failed."
          }

          python -c "from PIL import Image; import sys; icon=Image.open(sys.argv[1]); required={(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)}; sizes=set(icon.info.get('sizes',set())); assert icon.format == 'ICO'; assert required.issubset(sizes), f'Missing icon sizes: {sorted(required-sizes)}'; print('ICO resource validated:', sorted(sizes))" "$icon"
          if ($LASTEXITCODE -ne 0) {
            throw "Generated Windows icon validation failed."
          }

          "icon=$icon" >> $env:GITHUB_OUTPUT
          "version_file=$versionFile" >> $env:GITHUB_OUTPUT
          "runtime_hook=$runtimeHook" >> $env:GITHUB_OUTPUT

      - name: Compile Windows executable
        id: exe
        shell: pwsh
        working-directory: source
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $name = "Post-Quantum-Security-v$version"
          $oqsDll = "${{ steps.liboqs.outputs.dll }}"
          $runtimeHook = "${{ steps.metadata.outputs.runtime_hook }}"
          $icon = "${{ steps.metadata.outputs.icon }}"
          $versionFile = "${{ steps.metadata.outputs.version_file }}"

          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name $name `
            --icon "$icon" `
            --version-file "$versionFile" `
            --runtime-hook "$runtimeHook" `
            --hidden-import oqs `
            --collect-submodules oqs `
            --copy-metadata liboqs-python `
            --add-binary "$oqsDll;oqs-runtime/bin" `
            main.py

          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller failed with exit code $LASTEXITCODE."
          }

          $exe = Join-Path "dist" "$name.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected executable was not generated: $exe"
          }

          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "Generated file is not a valid Windows PE executable."
          }

          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLower()
          $shaFile = "$exe.sha256"
          "$hash  $name.exe" | Set-Content -Path $shaFile -Encoding ascii

          "path=$exe" >> $env:GITHUB_OUTPUT
          "sha=$shaFile" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "name=$name.exe" >> $env:GITHUB_OUTPUT

      - name: Validate Windows EXE resources and details
        shell: pwsh
        working-directory: source
        env:
          VERSION: ${{ steps.release.outputs.version }}
          EXE_PATH: ${{ steps.exe.outputs.path }}
        run: |
          $info = (Get-Item $env:EXE_PATH).VersionInfo
          $expected = @{
            CompanyName = "BylickiLabs"
            FileDescription = "BylickiLabs Post Quantum Security"
            FileVersion = "$env:VERSION.0"
            InternalName = "PostQuantumSecurity"
            LegalCopyright = "Copyright © 2026 Thorsten Bylicki / BylickiLabs"
            OriginalFilename = "Post-Quantum-Security-v$env:VERSION.exe"
            ProductName = "Post Quantum Security"
            ProductVersion = "$env:VERSION"
            Comments = "BylickiLabs Post Quantum Security is a Windows desktop application for post-quantum encryption, digital signatures, secure key management and local encrypted storage."
          }

          foreach ($key in $expected.Keys) {
            $actual = [string]$info.$key
            if ($actual -ne $expected[$key]) {
              throw "Windows EXE metadata mismatch for $key. Expected '$($expected[$key])', got '$actual'."
            }
          }

          python -c "import pefile,sys; pe=pefile.PE(sys.argv[1]); ids={entry.id for entry in pe.DIRECTORY_ENTRY_RESOURCE.entries if entry.id is not None}; assert 14 in ids, 'RT_GROUP_ICON resource missing'; assert 16 in ids, 'RT_VERSION resource missing'; print('Windows icon and version resources validated.')" "$env:EXE_PATH"
          if ($LASTEXITCODE -ne 0) {
            throw "Windows PE resource validation failed."
          }

          Write-Host "Windows Explorer detail metadata validated successfully."

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v7
        with:
          name: Post-Quantum-Security-Windows-EXE-v${{ steps.release.outputs.version }}
          path: |
            source/${{ steps.exe.outputs.path }}
            source/${{ steps.exe.outputs.sha }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload EXE to GitHub Release
        shell: pwsh
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release upload $env:RELEASE_TAG `
            "${{ steps.exe.outputs.path }}" `
            "${{ steps.exe.outputs.sha }}" `
            --clobber `
            --repo $env:GH_REPO

      - name: Update README Windows EXE download
        shell: pwsh
        working-directory: repository
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git pull --rebase origin main

          python -c @'
          import os
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          version = os.environ["VERSION"]
          tag = os.environ["RELEASE_TAG"]
          repository = os.environ["REPOSITORY"]
          start = "<!-- WINDOWS-EXE-RELEASE:START -->"
          end = "<!-- WINDOWS-EXE-RELEASE:END -->"
          block = "\n".join([
              start,
              f"| [⬇ Download Post Quantum Security v{version} (.exe)](https://github.com/{repository}/releases/download/{tag}/Post-Quantum-Security-v{version}.exe) | [⬇ Latest Release](https://github.com/{repository}/releases/latest) |",
              "|---|---|",
              end,
          ])

          if start in text and end in text:
              before = text.split(start, 1)[0].rstrip()
              after = text.split(end, 1)[1].lstrip()
              updated = f"{before}\n\n{block}\n\n{after}"
          else:
              lines = text.splitlines()
              insert_at = None
              for index, line in enumerate(lines):
                  if "Download Post Quantum Security" in line and "releases/download" in line:
                      insert_at = min(index + 2, len(lines))
                      break
              if insert_at is None:
                  insert_at = 0
              lines[insert_at:insert_at] = ["", block, ""]
              updated = "\n".join(lines)
              if text.endswith("\n"):
                  updated += "\n"

          if updated != text:
              path.write_text(updated, encoding="utf-8")
          '@

          if (git diff --quiet -- README.md) {
            Write-Host "README Windows EXE link is already current."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README Windows EXE download"
          git pull --rebase origin main
          git push origin main

      - name: Write EXE release summary
        shell: pwsh
        run: |
          @"
          ## Windows EXE Release

          - Version: `${{ steps.release.outputs.version }}`
          - Release: `${{ steps.release.outputs.tag }}`
          - Executable: `${{ steps.exe.outputs.name }}`
          - SHA-256: `${{ steps.exe.outputs.sha256 }}`
          - Embedded runtime: liboqs / ML-KEM-768 / ML-DSA-65
          - Windows icon: embedded and validated
          - Windows version metadata: embedded and validated
          - Languages: German / English
          - README download link: synchronized
          "@ >> $env:GITHUB_STEP_SUMMARY
