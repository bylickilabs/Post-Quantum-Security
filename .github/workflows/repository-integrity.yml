name: PQS Repository Integrity

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pqs-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: Repository Integrity Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install YAML validator
        run: python -m pip install PyYAML

      - name: Validate required project structure
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "README.md"
            "main.py"
            "requirements.txt"
            "app/constants.py"
            "app/database.py"
            "app/i18n.py"
            "crypto/core.py"
            "crypto/container.py"
            "crypto/keys.py"
            "crypto/pq.py"
            "crypto/signatures.py"
            "gui/main_window.py"
            ".github/ISSUE_TEMPLATE/config.yml"
          )
          missing=0
          for path in "${required[@]}"; do
            if [[ ! -e "$path" ]]; then
              echo "::error file=$path::Required project file is missing."
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Reject tracked sensitive file types
        shell: bash
        run: |
          set -euo pipefail
          matches="$(git ls-files | grep -Ei '(^|/)(\.env($|\.)|.*\.(qkey|qsigkey|pem|p12|pfx|sqlite|sqlite3|db))$' || true)"
          if [[ -n "$matches" ]]; then
            echo "$matches"
            echo "::error::Sensitive key, database, or environment files must not be committed."
            exit 1
          fi

      - name: Scan tracked content for private-key and token markers
        shell: bash
        run: |
          set -euo pipefail
          markers="$(git grep -nEI 'BEGIN ([A-Z0-9 ]+ )?PRIVATE KEY|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}' -- . || true)"
          if [[ -n "$markers" ]]; then
            echo "$markers"
            echo "::error::Potential private key or access token material detected in tracked files."
            exit 1
          fi

      - name: Validate YAML syntax and Issue Forms
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          import yaml

          files = sorted(Path(".github").rglob("*.yml")) + sorted(Path(".github").rglob("*.yaml"))
          errors = []

          for path in files:
              try:
                  data = yaml.safe_load(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  errors.append(f"{path}: invalid YAML: {exc}")
                  continue

              if path.parent.name == "ISSUE_TEMPLATE" and path.name != "config.yml":
                  if not isinstance(data, dict):
                      errors.append(f"{path}: Issue Form must be a mapping.")
                      continue
                  for key in ("name", "description", "body"):
                      if key not in data:
                          errors.append(f"{path}: missing required Issue Form key '{key}'.")
                  if not isinstance(data.get("body"), list) or not data.get("body"):
                      errors.append(f"{path}: Issue Form body must be a non-empty list.")

          if errors:
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)

          print(f"Validated {len(files)} YAML files.")
          PY

      - name: Check version consistency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          constants = Path("app/constants.py").read_text(encoding="utf-8")
          match = re.search(r'APP_VERSION\s*=\s*"([^"]+)"', constants)
          if not match:
              print("::warning file=app/constants.py::APP_VERSION could not be determined.")
              raise SystemExit(0)

          version = match.group(1)
          readme = Path("README.md").read_text(encoding="utf-8")
          installer = Path("install-windows.ps1").read_text(encoding="utf-8") if Path("install-windows.ps1").exists() else ""

          print(f"Application version: {version}")
          if version not in readme:
              print(f"::warning file=README.md::APP_VERSION {version} is not explicitly present in README.md.")
          if installer and version not in installer:
              print(f"::warning file=install-windows.ps1::APP_VERSION {version} is not present in install-windows.ps1.")
          PY

      - name: Write integrity summary
        if: always()
        shell: bash
        run: |
          {
            echo "## PQS Repository Integrity"
            echo
            echo "- Required project structure checked"
            echo "- Sensitive tracked file types checked"
            echo "- Private-key/token markers checked"
            echo "- GitHub YAML and Issue Forms validated"
            echo "- Version consistency reviewed"
          } >> "$GITHUB_STEP_SUMMARY"
